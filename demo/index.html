<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="light dark">
<title>Supplier Radar · demo</title>
<meta name="description" content="Seguimiento de documentos de proveedores: clasifica las respuestas por nivel de confianza, deja lo dudoso a una persona y calcula el estado con fechas.">
<meta property="og:type" content="website">
<meta property="og:title" content="Supplier Radar · seguimiento de proveedores">
<meta property="og:description" content="Demo con datos ficticios: bandeja con revisión humana, ficha de cada proveedor con sus documentos y registro de decisiones. Hecho sobre Google Workspace.">
<meta property="og:url" content="https://dsergio909.github.io/supplier-radar/">
<meta property="og:image" content="https://dsergio909.github.io/supplier-radar/demo/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
</head>
<body>
<a class="skip" href="#main" data-i18n="skip"></a>
<header class="bar">
  <div class="bar-left">
    <span class="app-name">Supplier Radar</span>
    <span class="bar-sep" aria-hidden="true"></span>
    <span class="app-module" data-i18n="module"></span>
  </div>
  <nav class="views" aria-label="Secciones" data-i18n-label="sections">
    <a href="#bandeja" data-view="inbox"><span data-i18n="viewInbox"></span> <span class="badge" id="navReview"></span></a>
    <a href="#proveedores" data-view="suppliers" data-i18n="viewSuppliers"></a>
    <a href="#registro" data-view="log" data-i18n="viewLogShort"></a>
  </nav>
  <div class="bar-right">
    <span class="sample" data-i18n="sample"></span>
    <a id="howLink" href="https://github.com/Dsergio909/supplier-radar/blob/main/docs/como-funciona.md" data-i18n="how"></a>
    <div class="lang" role="group" aria-label="Idioma / Language">
      <button type="button" data-lang="es">ES</button><button type="button" data-lang="en">EN</button>
    </div>
  </div>
</header>

<main id="main">
  <!-- Bandeja -->
  <section class="view inbox" id="view-inbox" aria-labelledby="inboxTitle">
    <h1 class="sr-only" id="inboxTitle" data-i18n="viewInbox"></h1>
    <div class="list-pane">
      <div class="tabs" role="tablist" id="mailTabs">
        <button type="button" role="tab" data-tab="review"><span data-i18n="tabReview"></span> <span class="count" id="cReview"></span></button>
        <button type="button" role="tab" data-tab="confirmed"><span data-i18n="tabConfirmed"></span> <span class="count" id="cConfirmed"></span></button>
        <button type="button" role="tab" data-tab="ignored"><span data-i18n="tabIgnored"></span> <span class="count" id="cIgnored"></span></button>
      </div>
      <label class="search"><span class="sr-only" data-i18n="searchMail"></span>
        <input type="search" id="mailSearch" autocomplete="off"></label>
      <ul class="mail-list" id="mailList"></ul>
    </div>
    <div class="read-pane" id="readPane" tabindex="-1" aria-live="polite"></div>
  </section>

  <!-- Proveedores -->
  <section class="view suppliers" id="view-suppliers" aria-labelledby="supTitle" hidden>
    <div class="table-pane">
      <div class="page-head">
        <div>
          <h1 id="supTitle" data-i18n="viewSuppliers"></h1>
          <p class="sub" data-i18n="supSub"></p>
        </div>
        <div class="clock">
          <label for="dayOffset"><span data-i18n="simDate"></span> <strong id="today"></strong></label>
          <input id="dayOffset" type="range" min="0" max="120" step="1" value="0">
        </div>
      </div>
      <div class="filters">
        <div class="chips" role="group" aria-label="Estado" data-i18n-label="filterStatus" id="statusChips"></div>
        <label class="search narrow"><span class="sr-only" data-i18n="searchSup"></span>
          <input type="search" id="supSearch" autocomplete="off"></label>
      </div>
      <div class="table-wrap" tabindex="0" role="region" aria-label="Tabla" data-i18n-label="tableSup">
        <table class="grid sup-table">
          <thead><tr>
            <th scope="col" data-i18n="colSupplier"></th>
            <th scope="col" data-i18n="colStatus"></th>
            <th scope="col" class="num" data-i18n="colEnds"></th>
            <th scope="col" data-i18n="colDocs"></th>
            <th scope="col" data-i18n="colActivity"></th>
          </tr></thead>
          <tbody id="supRows"></tbody>
        </table>
      </div>
      <p class="legend" id="docLegend"></p>
    </div>
    <div class="detail-pane" id="supDetail" tabindex="-1" aria-live="polite"></div>
  </section>

  <!-- Registro -->
  <section class="view log" id="view-log" aria-labelledby="logTitle" tabindex="0" hidden>
    <div class="page-head">
      <div>
        <h1 id="logTitle" data-i18n="viewLog"></h1>
        <p class="sub" data-i18n="logSub"></p>
      </div>
    </div>
    <div class="table-wrap" tabindex="0" role="region" aria-label="Tabla" data-i18n-label="tableLog">
      <table class="grid log-table">
        <thead><tr>
          <th scope="col" data-i18n="colWhen"></th>
          <th scope="col" data-i18n="colMail"></th>
          <th scope="col" data-i18n="colDecision"></th>
          <th scope="col" data-i18n="colSupplier"></th>
          <th scope="col" data-i18n="colWho"></th>
          <th scope="col" data-i18n="colDetail"></th>
        </tr></thead>
        <tbody id="logRows"></tbody>
      </table>
    </div>
  </section>
</main>

<footer class="foot">
  <span data-i18n="footer"></span>
  <span class="foot-links">
    <button type="button" class="link-btn" id="reset" data-i18n="reset"></button>
    <a href="https://github.com/Dsergio909/supplier-radar" data-i18n="code"></a>
    <a href="https://dsergio909.github.io/">Sergio García</a>
  </span>
</footer>

<script src="../src/core/classifier.js"></script>
<script src="../src/core/compliance.js"></script>
<script src="../src/core/messages.js"></script>
<script src="../src/data/sample.js"></script>
<script src="app.js"></script>
</body>
</html>
